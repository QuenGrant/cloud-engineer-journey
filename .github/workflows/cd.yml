name: CD Pipeline

on:
  workflow_run:
    workflows:
      - CI Pipeline
    types:
      - completed

jobs:
  delivery:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Projects/Cloud-Operations-Dashboard/docker/Dockerfile -t cloud-operations-dashboard Projects/Cloud-Operations-Dashboard

      - name: Deployment placeholder
        run: echo "Deployment stage ready for EC2 integration"
